# Knowledge Graph Configuration File

# LLM Provider Configuration
# Supported providers: "openai", "anthropic", "ollama"
llm:
  provider: "ollama"  # Change this to use different providers

  # Model names for each provider
  models:
    openai: "gpt-4o-mini"  # or "gpt-4", "gpt-3.5-turbo"
    anthropic: "claude-3-5-sonnet-20241022"  # or "claude-3-haiku-20240307"
    ollama: "llama3.2"  # or "mistral", "phi3", etc.

  # API Configuration (set via environment variables for security)
  # OPENAI_API_KEY=your_key_here
  # ANTHROPIC_API_KEY=your_key_here
  # OLLAMA_HOST=http://localhost:11434

  # Model parameters
  temperature: 0.1
  max_tokens: 2000
  timeout: 60

# Document Processing Configuration
document_processing:
  chunk_size: 1000
  chunk_overlap: 100
  batch_size: 5
  delay_between_batches: 2  # seconds

# Knowledge Graph Configuration
graph:
  # Minimum importance score to include in graph (1-5)
  min_importance: 2

  # Node size multiplier for visualization
  node_size_multiple: 6

  # Community detection
  enable_communities: true
  community_levels: 2

  # Visualization settings
  visualization:
    height: "900px"
    width: "100%"
    background_color: "#1a1a1a"
    font_color: "#cccccc"
    node_distance: 150
    spring_length: 400
    color_palette: "hls"

# Output Configuration
output:
  directory: "output"
  save_intermediate: true
  formats:
    - html
    - csv
    - json

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file: "logs/knowledge_graph.log"
